        select:focus,
        textarea:focus {

        }

    <br><br><br><br><br>
    <div class="container">
        <h2>Event Registration Feedback Form</h2>
        <form action="#" method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="registrationExperience">How was your registration experience?</label>
            <select id="registrationExperience" name="registrationExperience">
                <option value="#" selected disabled>Select</option>
                <option value="5">Very Easy</option>
                <option value="4">Easy</option>
                <option value="3">Neutral</option>
                <option value="2">Difficult</option>
                <option value="1">Very Difficult</option>
            </select>

            <label for="improvements">Any suggestions for improvement?</label>
            <textarea id="improvements" name="improvements" rows="3"></textarea>

            <label for="overallSatisfaction">Overall, how satisfied are you with the registration process?</label>
            <select id="overallSatisfaction" name="overallSatisfaction">
                <option value="5" selected disabled>Select</option>
                <option value="5">Very Satisfied</option>
                <option value="4">Satisfied</option>
                <option value="3">Neutral</option>
                <option value="2">Dissatisfied</option>
                <option value="1">Very Dissatisfied</option>
            </select>

            <button type="submit" class="submit-btn">Submit Feedback</button>
        </form>
    </div>
</body>
